<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watson NLP Emotion Detector</title>
</head>
<body>
  <main>
    <h1>Emotion Detection using IBM Watson NLP</h1>
    <form action="/emotionDetector" method="get">
      <label for="textToAnalyze">Enter text to analyze:</label>
      <textarea id="textToAnalyze" name="textToAnalyze" rows="5" cols="60"
                placeholder="Type a sentence..."></textarea>
      <button type="submit">Analyze emotion</button>
    </form>
  </main>
</body>
</html>
